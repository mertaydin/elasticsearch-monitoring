name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['11.*', '12.*']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.laravel == '11.*' && '^9.0' || '^10.0' }}"
          composer update --prefer-dist --no-interaction
      - name: Validate Composer
        run: composer validate --strict
      - name: Run tests
        run: composer test
      - name: Check formatting
        run: composer pint-test
