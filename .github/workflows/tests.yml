name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update "illuminate/support:12.*" "orchestra/testbench:^10.0"
          composer update --prefer-dist --no-interaction --no-audit
      - name: Validate Composer
        run: composer validate --strict
      - name: Check PHP syntax
        run: find config database routes src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: composer test
