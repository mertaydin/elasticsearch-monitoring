name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/view:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-audit
      - name: Validate Composer
        run: composer validate --strict
      - name: Check PHP syntax
        run: find config database routes src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: composer test
      - name: Static analysis
        run: composer analyse
      - name: Check code style
        run: composer pint-test
