name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Resolve development dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Audit dependencies for known vulnerabilities
        run: composer audit --no-interaction
      - name: Run automated tests
        run: composer test
      - name: Run PHPStan / Larastan
        run: composer analyse
      - name: Check PHP formatting
        run: composer pint-test
      - name: Check PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
